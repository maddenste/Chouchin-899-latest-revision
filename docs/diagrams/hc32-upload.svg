<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" rx="14" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#18283a"><text x="30" y="38" font-size="24" font-weight="bold">HC32 upload — UART</text><text x="30" y="65" font-size="15">Signal-name schematic — not physical connector order</text><rect x="30" y="85" width="230" height="170" rx="10" fill="#dce8f6"/><rect x="540" y="85" width="230" height="170" rx="10" fill="#deeee6"/><text x="50" y="115" font-size="20">DAPLink</text><text x="555" y="115" font-size="20">HC32 board</text><text x="65" y="150" font-size="19">U_TX</text><path d="M190 144 H550" stroke="#4283ad" stroke-width="3"/><text x="565" y="150" font-size="19">DIO</text><text x="65" y="188" font-size="19">U_RX</text><path d="M190 182 H550" stroke="#4283ad" stroke-width="3"/><text x="565" y="188" font-size="19">CLK</text><text x="65" y="226" font-size="19">GND</text><path d="M190 220 H550" stroke="#465567" stroke-width="3"/><text x="565" y="226" font-size="19">GND</text><text x="30" y="285" font-size="18" font-weight="bold">Clock power: 3.3 V external supply → battery terminals</text><text x="30" y="312" font-size="17">Supply + → battery +   ·   Supply − → battery −   ·   Batteries removed</text><text x="30" y="340" font-size="17">BOOT → supply +3.3 V during upload; disconnect BOOT before normal restart.</text><text x="30" y="372" font-size="16">Programmer 3V3 / 5V outputs disconnected. Programmer and board share GND.</text></g></svg>

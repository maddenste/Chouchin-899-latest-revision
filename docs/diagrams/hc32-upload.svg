<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title description">
  <title id="title">HC32 UART upload connections</title>
  <desc id="description">DAPLink U_TX connects to HC32 DIO, U_RX to CLK, and GND to GND. HC32 BOOT connects to the external supply positive 3.3 volt output during programming. The external supply powers the battery terminals. Disconnect BOOT before normal restart.</desc>
  <rect width="800" height="490" rx="14" fill="#f3f6fa"/>
  <g font-family="Arial,sans-serif" fill="#18283a">
    <text x="30" y="38" font-size="24" font-weight="bold">HC32 upload — UART</text>
    <text x="30" y="65" font-size="15">Signal-name schematic — not physical connector order</text>
    <rect x="30" y="85" width="230" height="205" rx="10" fill="#dce8f6"/>
    <rect x="540" y="85" width="230" height="205" rx="10" fill="#deeee6"/>
    <text x="50" y="115" font-size="20">DAPLink</text>
    <text x="555" y="115" font-size="20">HC32 board</text>
    <text x="65" y="150" font-size="19">U_TX</text>
    <path d="M190 144 H550" stroke="#4283ad" stroke-width="3"/>
    <text x="565" y="150" font-size="19">DIO</text>
    <text x="65" y="188" font-size="19">U_RX</text>
    <path d="M190 182 H550" stroke="#4283ad" stroke-width="3"/>
    <text x="565" y="188" font-size="19">CLK</text>
    <text x="65" y="226" font-size="19">GND</text>
    <path d="M190 220 H550" stroke="#465567" stroke-width="3"/>
    <text x="565" y="226" font-size="19">GND</text>
    <text x="565" y="270" font-size="19" font-weight="bold">BOOT</text>
    <path d="M635 264 H700 V345" fill="none" stroke="#bc5353" stroke-width="3"/>
    <circle cx="635" cy="264" r="4" fill="#bc5353"/>
    <rect x="540" y="345" width="230" height="62" rx="10" fill="#f6e5e5"/>
    <circle cx="700" cy="345" r="4" fill="#bc5353"/>
    <text x="555" y="370" font-size="18" font-weight="bold">External +3.3 V supply</text>
    <text x="555" y="394" font-size="15">Positive output (+)</text>
    <text x="30" y="335" font-size="18" font-weight="bold">Clock power → battery terminals</text>
    <text x="30" y="363" font-size="17">Supply + → battery +</text>
    <text x="30" y="389" font-size="17">Supply − → battery − · Batteries removed</text>
    <text x="30" y="441" font-size="16" font-weight="bold">Keep BOOT at +3.3 V during upload; disconnect it before normal restart.</text>
    <text x="30" y="471" font-size="16">Programmer 3V3 / 5V / nRST disconnected. Programmer and board share GND.</text>
  </g>
</svg>
